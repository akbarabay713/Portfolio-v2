name: Deploy

# Deploys all three designs to Vercel and points each at its own domain.
# Domains come from repo Variables, tokens/IDs from repo Secrets — nothing is
# hardcoded here. See DEPLOY.md for the one-time setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: comic, key: COMIC }
          - { app: neon, key: NEON }
          - { app: noir, key: NOIR }
    environment:
      name: production (${{ matrix.app }})
      url: https://${{ vars[format('{0}_DOMAIN', matrix.key)] }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.key)] }}
      # This app's own domain, plus all three so the design switcher links resolve.
      DOMAIN: ${{ vars[format('{0}_DOMAIN', matrix.key)] }}
      COMIC_DOMAIN: ${{ vars.COMIC_DOMAIN }}
      NEON_DOMAIN: ${{ vars.NEON_DOMAIN }}
      NOIR_DOMAIN: ${{ vars.NOIR_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check required config
        run: |
          missing=
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID_${{ matrix.key }}"
          [ -n "$DOMAIN" ] || missing="$missing ${{ matrix.key }}_DOMAIN"
          [ -n "$COMIC_DOMAIN" ] || missing="$missing COMIC_DOMAIN"
          [ -n "$NEON_DOMAIN" ] || missing="$missing NEON_DOMAIN"
          [ -n "$NOIR_DOMAIN" ] || missing="$missing NOIR_DOMAIN"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets/variables:$missing (see DEPLOY.md)"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        run: |
          set -euo pipefail
          url=$(vercel deploy --prod --yes \
            --build-env NEXT_PUBLIC_SITE_URL="https://$DOMAIN" \
            --build-env NEXT_PUBLIC_COMIC_URL="https://$COMIC_DOMAIN" \
            --build-env NEXT_PUBLIC_NEON_URL="https://$NEON_DOMAIN" \
            --build-env NEXT_PUBLIC_NOIR_URL="https://$NOIR_DOMAIN" \
            --token="$VERCEL_TOKEN" | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"

      - name: Point domain at this deployment
        run: |
          set -euo pipefail
          vercel alias set "${{ steps.deploy.outputs.url }}" "$DOMAIN" --token="$VERCEL_TOKEN"
          echo "**${{ matrix.app }}** → https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
