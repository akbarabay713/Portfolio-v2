name: Deploy

# Ships each app to its own Vercel project and domain.
# Tokens and domains come from repo secrets/variables — see DEPLOY.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app:
        description: Which design to deploy
        type: choice
        default: all
        options: [all, comic, neon, noir]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  # Cancel a superseded preview; never cancel a production deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # All three apps, or just the one chosen in a manual run.
  setup:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          app="${{ github.event.inputs.app }}"
          if [ -z "$app" ] || [ "$app" = "all" ]; then
            echo 'matrix={"include":[{"app":"comic","key":"COMIC"},{"app":"neon","key":"NEON"},{"app":"noir","key":"NOIR"}]}' >> "$GITHUB_OUTPUT"
          else
            key=$(echo "$app" | tr '[:lower:]' '[:upper:]')
            echo "matrix={\"include\":[{\"app\":\"$app\",\"key\":\"$key\"}]}" >> "$GITHUB_OUTPUT"
          fi

  production:
    needs: setup
    if: github.event_name != 'pull_request'
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    environment:
      name: production (${{ matrix.app }})
      url: https://${{ vars[format('{0}_DOMAIN', matrix.key)] }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.key)] }}
      # All three domains so the switcher can link between the sites.
      DOMAIN: ${{ vars[format('{0}_DOMAIN', matrix.key)] }}
      COMIC_DOMAIN: ${{ vars.COMIC_DOMAIN }}
      NEON_DOMAIN: ${{ vars.NEON_DOMAIN }}
      NOIR_DOMAIN: ${{ vars.NOIR_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check required config
        run: |
          missing=
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID_${{ matrix.key }}"
          [ -n "$DOMAIN" ] || missing="$missing ${{ matrix.key }}_DOMAIN"
          [ -n "$COMIC_DOMAIN" ] || missing="$missing COMIC_DOMAIN"
          [ -n "$NEON_DOMAIN" ] || missing="$missing NEON_DOMAIN"
          [ -n "$NOIR_DOMAIN" ] || missing="$missing NOIR_DOMAIN"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets/variables:$missing (see DEPLOY.md)"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        run: |
          set -euo pipefail
          url=$(vercel deploy --prod --yes \
            --build-env NEXT_PUBLIC_SITE_URL="https://$DOMAIN" \
            --build-env NEXT_PUBLIC_COMIC_URL="https://$COMIC_DOMAIN" \
            --build-env NEXT_PUBLIC_NEON_URL="https://$NEON_DOMAIN" \
            --build-env NEXT_PUBLIC_NOIR_URL="https://$NOIR_DOMAIN" \
            --token="$VERCEL_TOKEN" | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"

      - name: Point domain at this deployment
        run: |
          set -euo pipefail
          vercel alias set "${{ steps.deploy.outputs.url }}" "$DOMAIN" --token="$VERCEL_TOKEN"
          echo "**${{ matrix.app }}** → https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"

  # PRs get preview URLs — no --prod, domains left alone.
  preview:
    if: github.event_name == 'pull_request'
    name: Preview deploys
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_COMIC: ${{ secrets.VERCEL_PROJECT_ID_COMIC }}
      VERCEL_PROJECT_ID_NEON: ${{ secrets.VERCEL_PROJECT_ID_NEON }}
      VERCEL_PROJECT_ID_NOIR: ${{ secrets.VERCEL_PROJECT_ID_NOIR }}
      # Previews still point the switcher at the live sites.
      COMIC_DOMAIN: ${{ vars.COMIC_DOMAIN }}
      NEON_DOMAIN: ${{ vars.NEON_DOMAIN }}
      NOIR_DOMAIN: ${{ vars.NOIR_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Skip if secrets are unavailable
        id: gate
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not available (e.g. a fork PR); skipping preview."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.gate.outputs.run == 'true'
        run: npm install -g vercel@latest

      - name: Deploy previews
        if: steps.gate.outputs.run == 'true'
        id: deploy
        run: |
          set -euo pipefail
          # Only pass switcher URLs that are set.
          env_args=()
          [ -n "$COMIC_DOMAIN" ] && env_args+=(--build-env "NEXT_PUBLIC_COMIC_URL=https://$COMIC_DOMAIN")
          [ -n "$NEON_DOMAIN" ] && env_args+=(--build-env "NEXT_PUBLIC_NEON_URL=https://$NEON_DOMAIN")
          [ -n "$NOIR_DOMAIN" ] && env_args+=(--build-env "NEXT_PUBLIC_NOIR_URL=https://$NOIR_DOMAIN")

          table="| App | Preview |"$'\n'"| --- | --- |"$'\n'
          for app in comic neon noir; do
            key=$(echo "$app" | tr '[:lower:]' '[:upper:]')
            pid_var="VERCEL_PROJECT_ID_$key"
            export VERCEL_PROJECT_ID="${!pid_var}"
            if [ -z "$VERCEL_PROJECT_ID" ]; then
              table="$table| \`$app\` | _no project id — skipped_ |"$'\n'
              continue
            fi
            vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            url=$(vercel deploy --yes "${env_args[@]}" --token="$VERCEL_TOKEN" | tail -n1)
            table="$table| \`$app\` | $url |"$'\n'
          done

          {
            echo "table<<EOF"
            printf '%s' "$table"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment preview URLs on the PR
        if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        env:
          TABLE: ${{ steps.deploy.outputs.table }}
        with:
          script: |
            const marker = '<!-- preview-deploys -->';
            const body = `${marker}\n### Preview deployments\nCommit ${context.sha.slice(0, 7)}\n\n${process.env.TABLE}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
